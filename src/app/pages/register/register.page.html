<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Register</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <form (ngSubmit)="register()" #registerForm="ngForm">
    <ion-list>
      <ion-item>
        <ion-input label="Email" type="email" [(ngModel)]="credentials.email" name="email" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Password" type="password" [(ngModel)]="credentials.password" name="password" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Confirm Password" type="password" [(ngModel)]="credentials.confirmPassword" name="confirmPassword" required></ion-input>
      </ion-item>
      <ion-button expand="block" type="submit" [disabled]="registerForm.invalid">Register</ion-button>
      <ion-button expand="block" fill="clear" routerLink="/login" (click)="navigateToLogin()">Don't have an account? Register</ion-button>
    </ion-list>
  </form>
</ion-content>
